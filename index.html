<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free ear trainer for double bass beginners: hear pizzicato notes, name them, find them on the fingerboard, read them in bass clef, play along with a metronome.">
<meta name="theme-color" content="#1b1714">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Double Bass Ear Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bass Ear">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: phone-first practice stack (scales → mode → prompt card → answers → fingerboard); on wide screens the ebony fingerboard sits in its own right-hand column. */
:root{
  --bg:#eceee8; --surface:#f9faf6; --ink:#1b201d; --muted:#59625b; --line:#d2d8cd;
  --accent:#1f5a6b; --accent-ink:#ffffff; --accent-soft:#d5e5e9;
  --ok:#2c8553; --ok-soft:#d8eedf; --bad:#c2432e; --bad-soft:#f5dbd5; --on-bad:#ffffff;
  /* the instrument itself keeps its colours in both themes */
  --ebony:#1b1714; --ebony-2:#2a221c; --nut:#efe5cf; --string:#c9c1ae; --string-hi:#f3ecdb;
  --fret:rgba(243,236,219,.10); --tape:rgba(243,236,219,.26);
  --dot:#f3ecdb; --dot-ink:#1b1714; --tonic:#e2a23a; --hl:#86d3e4; --finger:#d9cfba;
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111412; --surface:#1a1e1b; --ink:#e6ebe5; --muted:#9ba49c; --line:#2d332f;
    --accent:#7cc4d6; --accent-ink:#0d1a1e; --accent-soft:#1d3239;
    --ok:#5cc489; --ok-soft:#173023; --bad:#ec7a64; --bad-soft:#3a1d17; --on-bad:#1b0d09;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1a1e1b; --ink:#e6ebe5; --muted:#9ba49c; --line:#2d332f;
  --accent:#7cc4d6; --accent-ink:#0d1a1e; --accent-soft:#1d3239;
  --ok:#5cc489; --ok-soft:#173023; --bad:#ec7a64; --bad-soft:#3a1d17; --on-bad:#1b0d09;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:1080px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1;letter-spacing:-.025em;text-wrap:balance}
.ghost-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.ghost-btn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* scale chips */
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 7px;min-height:46px;font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1}
.chip small{font-family:var(--font-body);font-weight:700;font-size:12px;color:var(--muted)}
.chip .meter{display:block;width:100%;min-width:44px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.chip .meter i{display:block;height:100%;background:var(--ok)}
.chip .tick{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center}
.chip .tick svg{width:11px;height:11px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip[aria-pressed="true"] .meter{background:color-mix(in srgb, var(--accent-ink) 30%, transparent)}
.chip[aria-pressed="true"] .meter i{background:var(--accent-ink)}

/* mode tabs */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:9px 11px;min-height:46px}
.mode b{font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1.1}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.25}
.mode[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode[aria-selected="true"] span{color:inherit;opacity:.75}
@media (max-width:560px){ .mode span{display:none} .mode{align-items:center;text-align:center;padding:9px 2px;min-width:0} .mode b{font-size:clamp(12.5px,3.7vw,15.5px);letter-spacing:-.01em} }

/* settings */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px}
.settings[hidden]{display:none!important}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;text-transform:none}
.field select{appearance:none;-webkit-appearance:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;min-height:44px;width:100%;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.settings .wide{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}
.credit{font-size:13px;color:var(--muted);margin:0}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:820px){
  .grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
  .board-col{position:sticky;top:12px}
}

/* prompt card */
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.prompt-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.instr{margin:0;font-weight:700;font-size:16px}
.score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prompt-body{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.staff-box{flex:1 1 180px;min-width:0;max-width:280px;display:flex;flex-direction:column;align-items:center;gap:2px}
.staff-box.wide{flex-basis:100%;max-width:440px;margin-inline:auto}
.staff-box svg{width:100%;height:auto;display:block}
.note-name{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;min-height:30px;letter-spacing:-.01em}
.where{font-size:13.5px;color:var(--muted);text-align:center;min-height:1.3em}
.actions{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;min-height:48px;padding:10px 14px;font-weight:700;font-size:16px;border:1.5px solid var(--line);background:var(--bg);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px}
.btn.big{min-height:60px;font-size:18px}
.btn svg{width:18px;height:18px;flex:none}
.btn.small{min-height:40px;font-size:14px;padding:8px 12px}
.btn:disabled{opacity:.45}
.tempo{display:flex;flex-direction:column;gap:4px}
.tempo-row{display:flex;align-items:center;gap:8px}
.tempo-row output{font-family:var(--font-display);font-weight:800;font-size:30px;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.tempo-row .bpm{font-size:13px;color:var(--muted);font-weight:700;margin-right:auto}
.tbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;line-height:1}
.tempo input[type=range],input.vol{width:100%;accent-color:var(--accent);height:32px}
.actions .check{min-height:32px}
.hint{margin:-2px 0 0;font-size:13.5px;color:var(--muted)}
.count{display:inline-flex;gap:14px}
.count b{color:var(--line);font-weight:800}
.count b.on{color:var(--accent)}
.btn.toggle[aria-pressed="false"]{background:transparent;border-style:dashed;color:var(--muted)}
.feedback{margin:0;min-height:1.45em;font-size:15.5px}
.feedback.good{color:var(--ok);font-weight:700}
.feedback.bad{color:var(--bad);font-weight:700}

/* name buttons */
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px}
.answers[hidden]{display:none!important}
.nbtn{min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1}
.nbtn:disabled{opacity:.45}
.nbtn.tonic{border-color:color-mix(in srgb, var(--tonic) 70%, var(--line))}
.nbtn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.nbtn.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.nbtn.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* tricky notes */
.tricky{display:flex;flex-direction:column;gap:8px}
.tricky[hidden]{display:none!important}
.tricky-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.tchip b{font-family:var(--font-display);font-weight:800}

/* fingerboard */
.board-wrap{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#board{width:100%;max-width:400px;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.fb-board{fill:var(--ebony)}
.fb-head{fill:var(--ebony-2)}
.fb-pos{stroke:var(--fret);stroke-width:1.2}
.fb-tape{stroke:var(--tape);stroke-width:6}
.fb-nut{fill:var(--nut)}
.fb-str{stroke:var(--string)}
.fb-strname{fill:var(--ink);font:800 15px var(--font-display);text-anchor:middle}
.dot-ghost{fill:var(--string-hi);opacity:.5}
.dot-key{fill:var(--dot)}
.dot-tonic{fill:var(--tonic)}
.dot-target{fill:var(--hl)}
.dot-wrong{fill:var(--bad)}
.dot-txt{fill:var(--dot-ink);font:700 13px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dot-txt.light{fill:var(--on-bad)}
.dot-txt.sm{font-size:10.5px}
.fb-finger{fill:var(--finger);font:700 11.5px var(--font-body);text-anchor:start;dominant-baseline:central;pointer-events:none}
.ring{fill:none;stroke:var(--hl);stroke-width:3}
.pulse{animation:pulse 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flash{animation:flash .45s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
@keyframes flash{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}

.staff-line{stroke:var(--ink);stroke-width:1.2}
.staff-ink{fill:var(--ink)}
.staff-stroke{stroke:var(--ink);fill:none}
.staff-on{fill:var(--accent);stroke:var(--accent);stroke-width:2.4}
.staff-fing{fill:var(--muted);font:700 15px var(--font-body);text-anchor:middle}
.staff-fing.on{fill:var(--accent);font-weight:800}
.staff-q{fill:var(--muted);font:800 34px var(--font-display);text-anchor:middle}
.staff-acc{fill:var(--ink);font:400 24px var(--font-body);text-anchor:middle}

@media (prefers-reduced-motion: reduce){ .pulse,.flash,.nbtn.shake{animation:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Double Bass Ear Trainer</h1>
    <button id="settingsBtn" class="ghost-btn" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
  </header>

  <section id="settingsPanel" class="settings" hidden aria-label="Settings">
    <div class="field">
      <label for="setVolume">Volume</label>
      <input type="range" id="setVolume" class="vol" min="0" max="100" step="1">
    </div>
    <div class="field">
      <label for="setPrelude">Before each note, play</label>
      <select id="setPrelude">
        <option value="none">Nothing</option>
        <option value="tonic">The key note (tonic)</option>
        <option value="arp">The key chord (1-3-5-8)</option>
      </select>
    </div>
    <div class="field">
      <label for="setNaming">Note names</label>
      <select id="setNaming">
        <option value="letters">C D E F G A B</option>
        <option value="solfege">Do Re Mi Fa Sol La Si</option>
        <option value="greek">Ντο Ρε Μι Φα Σολ Λα Σι</option>
      </select>
    </div>
    <div class="field">
      <label for="setHints">Fingerboard during a question</label>
      <select id="setHints">
        <option value="none">Empty (hardest)</option>
        <option value="dots">Dots on the scale notes</option>
        <option value="names">Dots with note names</option>
      </select>
    </div>
    <div class="field">
      <span class="label">Options</span>
      <label class="check"><input type="checkbox" id="setFingers"> Show finger numbers</label>
      <label class="check"><input type="checkbox" id="setAuto"> Next note automatically</label>
      <label class="check"><input type="checkbox" id="setOctave"> Play an octave higher (phone speaker)</label>
    </div>
    <p class="credit wide">Sounds: University of Iowa Musical Instrument Samples. Progress is saved on this device.</p>
  </section>

  <section class="chips" id="scaleChips" aria-label="Scales"></section>

  <nav class="modes" id="modeTabs" role="tablist" aria-label="Practice mode"></nav>

  <main class="grid">
    <div class="col">
      <section class="prompt" id="prompt" aria-live="polite"></section>
      <section class="answers" id="answers" aria-label="Note names"></section>
    </div>
    <div class="col board-col">
      <figure class="board-wrap">
        <svg id="board" role="img" aria-label="Double bass fingerboard. Tap a spot to play that note."></svg>
      </figure>
      <section class="tricky" id="tricky" hidden></section>
    </div>
  </main>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- settings, stats, scale library ---------- */
const DEFAULTS = {sel:'F', mode:'name', naming:'letters', prelude:'tonic', hints:'dots', fingers:true, auto:true, octave:false, bpm:60, metro:true, loop:false, volume:100};
const savedSettings = store.get('cbet.settings', {});
const settings = Object.assign({}, DEFAULTS, savedSettings);
if(savedSettings.key && !savedSettings.sel) settings.sel = savedSettings.key; // older version stored "key"
delete settings.key; delete settings.range;
const stats = Object.assign({miss:{}, hist:{}}, store.get('cbet.stats', {}));
stats.hist = stats.hist || {};
if(savedSettings.volume === 85 || savedSettings.volume == null) settings.volume = 100; // louder default since v9
delete settings.boost; delete settings.sound;
const saveSettings = () => store.set('cbet.settings', settings);
const saveStats = () => store.set('cbet.stats', stats);

// A scale = key + the exact spots it is played in: [string (0=E..3=G), semitones above open, finger]
const STARTERS = [
  {id:'F',  tonic:'F',  mode:'major', pos:[[0,1,1],[0,3,4],[1,0,0],[1,1,1],[1,3,4],[2,0,0],[2,2,2],[2,3,4]]},
  {id:'Bb', tonic:'Bb', mode:'major', pos:[[1,1,1],[1,3,4],[2,0,0],[2,1,1],[2,3,4],[3,0,0],[3,2,2],[3,3,4]]},
  {id:'G',  tonic:'G',  mode:'major', pos:[[0,3,2],[1,0,0],[1,2,1],[1,3,2],[2,0,0],[2,2,1],[2,4,4],[3,0,0]]}
];
const library = STARTERS; // only the scales taught in class

/* ---------- music theory ---------- */
const STRINGS = [{name:'E', midi:28}, {name:'A', midi:33}, {name:'D', midi:38}, {name:'G', midi:43}];
const LETTERS = 'CDEFGAB';
const LETTER_PC = [0,2,4,5,7,9,11];
const NAMES = {
  letters:['C','D','E','F','G','A','B'],
  solfege:['Do','Re','Mi','Fa','Sol','La','Si'],
  greek:['Ντο','Ρε','Μι','Φα','Σολ','Λα','Σι']
};
const STEPS = {major:[2,2,1,2,2,2,1], minor:[2,1,2,2,1,2,2]};
const SHARP_DN = {F:24, C:21, G:25, D:22, A:19, E:23, B:20}; // key-signature places on the bass-clef staff
const FLAT_DN = {B:20, E:23, A:19, D:22, G:18, C:21, F:17};
const mod12 = x => ((x % 12) + 12) % 12;
const parse = str => { const l = LETTERS.indexOf(str[0]); const acc = str.length > 1 ? (str[1] === 'b' ? -1 : 1) : 0; return {l, acc, pc:mod12(LETTER_PC[l] + acc)}; };
const accSym = a => a === 0 ? '' : a > 0 ? '♯'.repeat(a) : '♭'.repeat(-a);
const noteName = sp => NAMES[settings.naming][sp.l] + accSym(sp.acc);

const infoCache = new Map();
function info(sc){
  const k = sc.tonic + sc.mode + JSON.stringify(sc.pos);
  if(infoCache.has(k)) return infoCache.get(k);
  const t = parse(sc.tonic), steps = STEPS[sc.mode] || STEPS.major, notes = [];
  let l = t.l, pc = t.pc;
  for(let i = 0; i < 7; i++){ notes.push({l, acc:mod12(pc - LETTER_PC[l] + 6) - 6, pc}); pc = mod12(pc + steps[i]); l = (l + 1) % 7; }
  const sharps = notes.filter(n => n.acc > 0).map(n => LETTERS[n.l]), flats = notes.filter(n => n.acc < 0).map(n => LETTERS[n.l]);
  const sig = sharps.length ? [...'FCGDAEB'].filter(c => sharps.includes(c)).map(c => ({acc:1, dn:SHARP_DN[c]}))
                            : [...'BEADGCF'].filter(c => flats.includes(c)).map(c => ({acc:-1, dn:FLAT_DN[c]}));
  const positions = sc.pos.map(([s, n, f]) => ({s, n, f, midi:STRINGS[s].midi + n}));
  const v = {notes, sig, tonicPc:t.pc, positions, flatKey:flats.length > 0, minor:sc.mode === 'minor'};
  infoCache.set(k, v);
  return v;
}
function spellIn(sc, midi){
  const I = info(sc), pc = mod12(midi);
  let n = I.notes.find(x => x.pc === pc);
  if(!n){ // a note outside the key: raise the note below, or lower the note above in flat keys
    const up = I.notes.find(x => x.pc === mod12(pc + 1)), dn = I.notes.find(x => x.pc === mod12(pc - 1));
    n = (I.flatKey && up) || !dn ? {l:up.l, acc:up.acc - 1, pc} : {l:dn.l, acc:dn.acc + 1, pc};
  }
  return Object.assign({midi}, n);
}
const scaleLabel = sc => ({name:noteName(parse(sc.tonic)), sub:sc.mode});

/* ---------- what is being practised ---------- */
function activeScales(){ return [library.find(x => x.id === settings.sel) || library[0]]; }
const focus = () => activeScales()[0];
function scaleFor(midi){
  const f = focus(); if(f) return f;
  const act = activeScales();
  return act.find(sc => info(sc).positions.some(p => p.midi === midi)) || act.find(sc => info(sc).notes.some(n => n.pc === mod12(midi))) || act[0];
}
const spell = (midi, sc) => spellIn(sc || scaleFor(midi), midi);
const nameMidi = (m, sc) => noteName(spell(m, sc));
function activePositions(){
  const seen = new Map();
  activeScales().forEach(sc => info(sc).positions.forEach(p => { const k = p.s + ':' + p.n; if(!seen.has(k)) seen.set(k, p); }));
  return [...seen.values()];
}
const pool = () => [...new Set(activePositions().map(p => p.midi))].sort((a, b) => a - b);
function allPositions(maxN){ const out = []; STRINGS.forEach((st, s) => { for(let n = 0; n <= maxN; n++) out.push({s, n, midi:st.midi + n}); }); return out; }
const displayMax = () => Math.max(4, ...activePositions().map(p => p.n));
function fingering(){
  const map = {};
  STRINGS.forEach((st, s) => { map[s + ':0'] = 0; });
  activePositions().forEach(p => { if(map[p.s + ':' + p.n] == null || p.n > 0) map[p.s + ':' + p.n] = p.f; });
  return map;
}
const posOf = m => activePositions().find(p => p.midi === m) || allPositions(12).find(p => p.midi === m);
function whereText(p, fing){
  const st = STRINGS[p.s].name;
  if(p.n === 0) return `open ${st} string`;
  const f = fing[p.s + ':' + p.n];
  return f ? `${st} string, finger ${f}` : `${st} string`;
}
function whereAll(m){
  const fing = fingering();
  let ps = activePositions().filter(p => p.midi === m);
  if(!ps.length) ps = allPositions(displayMax()).filter(p => p.midi === m);
  return ps.map(p => whereText(p, fing)).join(' · or ');
}

/* ---------- audio: real double bass pizzicato recordings ---------- */
// One recording per string position (open string up to the octave), from the
// University of Iowa Musical Instrument Samples. "c" = measured tuning offset in cents.
const SAMPLES = JSON.parse(document.getElementById('bass-samples').textContent);
const OPEN = STRINGS.map(s => s.midi);
let ctx = null, bus = null, master = null, gen = 0; const decoded = new Map(); let active = [];
function ensureAudio(){
  if(!ctx){
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 3;
    master.connect(comp); comp.connect(ctx.destination);
    bus = master;
    applySound();
    Object.keys(SAMPLES).forEach(getSample); // decode everything in the background
  }
  if(ctx.state !== 'running') ctx.resume().catch(() => {});
  return true;
}
// Original sound: the recordings as they are, through a gentle compressor.
// The Volume slider scales the level (100% = original level).
function applySound(){ if(master) master.gain.value = Math.pow(settings.volume / 100, 1.6); }
function getSample(key){
  if(!decoded.has(key)){
    const bin = atob(SAMPLES[key].d), u = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    decoded.set(key, new Promise((res, rej) => ctx.decodeAudioData(u.buffer, res, rej)));
  }
  return decoded.get(key);
}
function sampleFor(midi, s){
  const want = midi + (settings.octave ? 12 : 0);
  const at = (m, str) => { const n = m - OPEN[str]; return n >= 0 && n <= 12 ? str + ':' + n : null; };
  let key = s != null ? at(want, s) : null, mult = 1;
  if(!key){
    const c = OPEN.map((o, i) => ({n:want - o, i})).filter(x => x.n >= 0 && x.n <= 12).sort((x, y) => x.n - y.n)[0];
    if(c) key = c.i + ':' + c.n;
  }
  if(!key){ // octave-up beyond the recorded range: speed the original up
    key = (s != null ? at(midi, s) : null) || OPEN.map((o, i) => ({n:midi - o, i})).filter(x => x.n >= 0 && x.n <= 12).map(x => x.i + ':' + x.n)[0];
    mult = 2;
  }
  return {key, rate: mult * Math.pow(2, -SAMPLES[key].c / 1200)};
}
function play(midi, delay = 0, vel = 1, s = null){
  if(!ensureAudio()) return;
  playAt(midi, ctx.currentTime + 0.02 + delay, vel, s);
}
function playAt(midi, when, vel = 1, s = null){
  const {key, rate} = sampleFor(midi, s);
  const myGen = gen;
  getSample(key).then(buf => {
    if(myGen !== gen) return; // stopped while decoding
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
    const g = ctx.createGain(); g.gain.value = vel;
    src.connect(g); g.connect(bus);
    src.start(Math.max(when, ctx.currentTime + 0.005));
    const item = {src, g}; active.push(item);
    src.onended = () => { active = active.filter(x => x !== item); };
  }).catch(() => {});
}
function clickAt(when, accent){ // metronome tick
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = accent ? 1760 : 1245;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(accent ? 0.9 : 0.55, when + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
  o.connect(g); g.connect(bus); o.start(when); o.stop(when + 0.08);
  const item = {src:o, g}; active.push(item);
  o.onended = () => { active = active.filter(x => x !== item); };
}
function stopAll(){
  gen++;
  if(!ctx) return; const now = ctx.currentTime;
  active.forEach(({src, g}) => { try{ g.gain.cancelScheduledValues(now); g.gain.setTargetAtTime(0, now, 0.02); src.stop(now + 0.15); }catch(e){} });
  active = [];
}


/* ---------- reference before a question ---------- */
function lowestTonic(sc){ const tp = info(sc).tonicPc; let t = 28; while(mod12(t) !== tp) t++; return t; }
function refNotes(target, sc){
  const I = info(sc);
  if(settings.prelude === 'arp'){ const t = lowestTonic(sc); return [t, t + (I.minor ? 3 : 4), t + 7, t + 12]; }
  let r = target - mod12(target - I.tonicPc);
  if(r < 28) r += 12;
  return [r];
}
function playRef(target, sc){
  const arp = settings.prelude === 'arp';
  const refs = refNotes(target ?? lowestTonic(sc), sc);
  refs.forEach((m, i) => play(m, arp ? i * 0.32 : 0, 0.8));
  return arp ? refs.length * 0.32 + 0.55 : 1.1;
}
function playQuestion(){
  stopAll();
  let t = 0;
  if(settings.prelude !== 'none') t = playRef(q.target, q.sc);
  play(q.target, t, 1);
}

/* ---------- state ---------- */
const fresh = () => ({target:null, sc:null, solved:false, missed:false, attempts:0, wrongNames:new Set(), wrongTaps:[], showName:false, msg:'', kind:''});
let q = fresh();
const score = {right:0, total:0, streak:0};
const explore = {cur:null};
let flash = null, lastTarget = null, autoTimer = null, seqTimers = [];

function addMiss(m){ stats.miss[m] = (stats.miss[m] || 0) + 1; saveStats(); }
function easeMiss(m){ if(stats.miss[m]){ stats.miss[m] *= 0.5; if(stats.miss[m] < 0.3) delete stats.miss[m]; saveStats(); } }
function record(sc, ok){
  if(!sc) return;
  const h = stats.hist[sc.id] || []; h.push(ok ? 1 : 0); while(h.length > 20) h.shift();
  stats.hist[sc.id] = h; saveStats();
}
function mastery(sc){
  const h = stats.hist[sc.id] || []; if(!h.length) return null;
  const pct = Math.round(100 * h.reduce((a, b) => a + b, 0) / h.length);
  return {pct, learned: h.length >= 10 && pct >= 85};
}

function pickTarget(){
  const pl = pool();
  if(pl.length < 2) return null;
  const w = pl.map(m => m === lastTarget ? 0 : 1 + 2 * (stats.miss[m] || 0));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for(let i = 0; i < pl.length; i++){ r -= w[i]; if(r <= 0) return pl[i]; }
  return pl[pl.length - 1];
}
const promptText = () => ({name:'Which note was that?', find:'Where is it? Tap the spot.', read:'Where do you play it? Tap the spot.'})[settings.mode];

function newQuestion(playNow = true){
  clearTimeout(autoTimer); stopSequence();
  q = fresh();
  const t = pickTarget();
  if(t == null){ q.msg = 'This scale needs at least two different notes.'; q.kind = 'bad'; render(); return; }
  const cands = activeScales().filter(sc => info(sc).positions.some(p => p.midi === t));
  q.target = t; q.sc = cands[Math.floor(Math.random() * cands.length)] || activeScales()[0];
  lastTarget = t; q.msg = promptText();
  if(settings.mode !== 'read' && playNow) playQuestion();
  render();
}
function resetQuestion(){
  clearTimeout(autoTimer); along = null; stopSequence(); stopAll();
  q = fresh(); explore.cur = null;
  if(settings.mode === 'read') newQuestion(false); else render();
}
function solve(revealed){
  q.solved = true; score.total++;
  const nm = nameMidi(q.target, q.sc);
  record(q.sc, !q.missed && !revealed);
  if(revealed){
    score.streak = 0; q.kind = ''; q.msg = `It was ${nm}.`;
  } else if(!q.missed){
    score.right++; score.streak++; easeMiss(q.target); q.kind = 'good';
    q.msg = score.streak >= 3 ? `Yes, ${nm}! ${score.streak} in a row.` : `Yes, it's ${nm}. First try!`;
  } else {
    score.streak = 0; q.kind = 'good'; q.msg = `Yes, it's ${nm}.`;
  }
  render();
  if(settings.auto && !revealed) autoTimer = setTimeout(() => newQuestion(true), settings.mode === 'name' ? 2200 : 1900);
}
function markMiss(){ if(!q.missed){ q.missed = true; addMiss(q.target); } q.attempts++; }

/* ---------- interactions ---------- */
function onName(pc){
  if(q.target == null || q.solved) return;
  ensureAudio(); clearTimeout(autoTimer);
  if(pc === mod12(q.target)){ stopAll(); play(q.target); solve(false); return; }
  q.wrongNames.add(pc); markMiss();
  let cmp = q.target + mod12(pc - q.target); if(cmp - q.target > 6) cmp -= 12;
  const nm = nameMidi(cmp, q.sc);
  stopAll(); play(cmp, 0); play(q.target, 1.0);
  q.kind = 'bad'; q.msg = `Not ${nm}. You heard ${nm}, then the mystery note again.`;
  render();
  const b = document.querySelector(`.nbtn[data-pc="${pc}"]`); if(b) b.classList.add('shake');
}
function onTap(pos){
  if(!ensureAudio()) return;
  const midi = STRINGS[pos.s].midi + pos.n;
  flash = {s:pos.s, n:pos.n, id:Date.now()};
  const mode = settings.mode;
  if(mode === 'explore') return; // metronome tab is for listening
  if(mode === 'name' || q.target == null || q.solved){ play(midi, 0, 1, pos.s); renderBoard(); return; }
  clearTimeout(autoTimer); stopAll(); play(midi, 0, 1, pos.s);
  if(midi === q.target){ solve(false); return; }
  markMiss(); q.wrongTaps.push({...pos, midi});
  const nm = nameMidi(midi, q.sc), dir = q.target > midi ? 'higher' : 'lower';
  q.kind = 'bad';
  if(mod12(midi) === mod12(q.target)) q.msg = `Right name (${nm}), wrong octave. Go ${dir}.`;
  else if(mode === 'find') q.msg = `You played ${nm}. The mystery note is ${dir}.`;
  else q.msg = `That's ${nm}. The written note is ${dir}.`;
  render();
}
function stopSequence(){ seqTimers.forEach(clearTimeout); seqTimers = []; }
function runSequence(ps){
  stopSequence(); stopAll(); if(!ensureAudio()) return;
  const gap = 60 / settings.bpm;
  ps.forEach((p, i) => {
    play(p.midi, i * gap, 1, p.s);
    seqTimers.push(setTimeout(() => { explore.cur = {s:p.s, n:p.n, midi:p.midi}; flash = {s:p.s, n:p.n, id:Date.now()}; render(); }, i * gap * 1000 + 30));
  });
}
let along = null; // running metronome: {next: time of next beat, i: beat number (-4..-1 = count-in), timer}
function startAlong(){
  const f = focus(); if(!f || !ensureAudio()) return;
  stopSequence(); stopAll();
  const a = along = {next:ctx.currentTime + 0.5, i:-4, timer:null};
  a.timer = setInterval(() => tickAlong(a), 25); // schedule a little ahead, one beat at a time,
  tickAlong(a);                                   // so tempo and sound changes apply right away
  renderPrompt();
}
function tickAlong(a){
  if(along !== a){ clearInterval(a.timer); return; }
  const ps = scaleSeq(focus()), beats = Math.ceil((ps.length + 1) / 4) * 4; // whole 4/4 bars
  while(a.next < ctx.currentTime + 0.12){
    const when = a.next, i = a.i;
    if(i < 0){ // count-in: always 4 clicks, also shown on screen
      clickAt(when, true);
      seqTimers.push(setTimeout(() => { if(along === a) showCount(i + 5); }, Math.max(0, (when - ctx.currentTime) * 1000)));
    }
    else {
      if(settings.metro) clickAt(when, i % 4 === 0);
      const p = ps[i];
      if(p){
        playAt(p.midi, when, 1, p.s);
        seqTimers.push(setTimeout(() => { if(along !== a) return; explore.cur = {s:p.s, n:p.n, midi:p.midi}; flash = {s:p.s, n:p.n, id:Date.now()}; renderBoard(); updateExploreStaff(); }, Math.max(0, (when - ctx.currentTime) * 1000)));
      }
    }
    a.next += 60 / settings.bpm; a.i++;
    if(a.i >= beats){
      if(settings.loop){ a.i = 0; continue; }
      clearInterval(a.timer); // let the last note ring out, then show Play again
      seqTimers.push(setTimeout(() => { if(along === a){ along = null; if(settings.mode === 'explore') renderPrompt(); } }, Math.max(0, (a.next - ctx.currentTime) * 1000)));
      return;
    }
  }
}
function showCount(n){
  const box = $('#exStaff'); if(!box) return;
  const nm = box.querySelector('.note-name'), wh = box.querySelector('.where');
  if(nm) nm.innerHTML = `<span class="count">${[1, 2, 3, 4].map(k => `<b${k === n ? ' class="on"' : ''}>${k}</b>`).join('')}</span>`;
  if(wh) wh.textContent = n < 4 ? 'Get ready…' : 'Start!';
}
function stopAlong(){ along = null; stopSequence(); stopAll(); if(settings.mode === 'explore') renderPrompt(); }
function updateExploreStaff(){
  const box = $('#exStaff'), f = focus(); if(!box || !f) return;
  const cur = explore.cur ? STRINGS[explore.cur.s].midi + explore.cur.n : null;
  box.innerHTML = scaleStaffSVG(f, cur) + `<div class="note-name">${cur != null ? nameMidi(cur) : ''}</div><div class="where">${cur != null ? whereText(explore.cur, fingering()) : ''}</div>`;
}
function scaleSeq(sc){
  const up = info(sc).positions;
  return up.concat(up.slice(0, -1).reverse());
}

/* ---------- rendering: staff ---------- */
// Flats and sharps are drawn as shapes, centred on the staff line/space at y,
// so they sit in the same place on every device (font glyphs differ on iPhone).
function accShape(acc, x, y, s = 1){
  const one = a => a < 0
    ? `<path class="staff-stroke" stroke-width="${1.5 * s}" stroke-linecap="round" d="M${x - 3 * s} ${y - 13 * s} V${y + 4.5 * s} C${x + 1 * s} ${y + 3 * s} ${x + 6 * s} ${y - 0.5 * s} ${x + 5 * s} ${y - 3.5 * s} C${x + 4 * s} ${y - 6.5 * s} ${x} ${y - 5 * s} ${x - 3 * s} ${y - 2 * s}"/>`
    : `<path class="staff-stroke" stroke-width="${1.3 * s}" d="M${x - 2.2 * s} ${y - 9 * s} V${y + 10 * s} M${x + 2.2 * s} ${y - 10 * s} V${y + 9 * s}"/>`
      + `<path class="staff-stroke" stroke-width="${2.6 * s}" d="M${x - 5 * s} ${y - 2 * s} L${x + 5 * s} ${y - 5 * s} M${x - 5 * s} ${y + 5 * s} L${x + 5 * s} ${y + 2 * s}"/>`;
  let o = ''; for(let i = 0; i < Math.abs(acc); i++) o += one(acc).replace(/M([\d.-]+)/g, (m, v) => 'M' + (Number(v) - i * 9 * s));
  return o;
}
function clefAndSig(out, sc, yOf){
  const yF = yOf(24);
  out.push(`<circle class="staff-ink" cx="15" cy="${yF}" r="3.8"/>`);
  out.push(`<path class="staff-stroke" stroke-width="3.2" stroke-linecap="round" d="M13 ${yF} C13 ${yF - 10}, 23 ${yF - 14}, 30 ${yF - 11} C39 ${yF - 7}, 39 ${yF + 8}, 32 ${yF + 17} C26 ${yF + 25}, 18 ${yF + 30}, 9 ${yF + 34}"/>`);
  out.push(`<circle class="staff-ink" cx="44" cy="${yF - 6}" r="2.3"/><circle class="staff-ink" cx="44" cy="${yF + 6}" r="2.3"/>`);
  const sig = sc ? info(sc).sig : [];
  sig.forEach((a, i) => out.push(accShape(a.acc, 60 + i * 11, yOf(a.dn))));
  return 58 + sig.length * 11;
}
const writtenDn = sp => (Math.floor((sp.midi - sp.acc) / 12) - 1 + 1) * 7 + sp.l; // bass sounds an octave lower than written
function ledgers(out, x, dn, yOf, half){
  for(let d = 16; d >= dn; d -= 2) out.push(`<line class="staff-line" x1="${x - half}" x2="${x + half}" y1="${yOf(d)}" y2="${yOf(d)}"/>`);
  for(let d = 28; d <= dn; d += 2) out.push(`<line class="staff-line" x1="${x - half}" x2="${x + half}" y1="${yOf(d)}" y2="${yOf(d)}"/>`);
}
function staffSVG(sp, placeholder, sc){
  const h = 6, Y0 = 102, yOf = dn => Y0 - (dn - 18) * h, W = 260, H = 148;
  const out = [`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`];
  for(let dn = 18; dn <= 26; dn += 2) out.push(`<line class="staff-line" x1="8" x2="${W - 8}" y1="${yOf(dn)}" y2="${yOf(dn)}"/>`);
  clefAndSig(out, sc, yOf);
  const nx = 170;
  if(sp){
    const dn = writtenDn(sp), y = yOf(dn);
    ledgers(out, nx, dn, yOf, 15);
    const inKey = sc && info(sc).notes.some(n => n.pc === sp.pc && n.acc === sp.acc && n.l === sp.l);
    if(!inKey && sp.acc !== 0) out.push(accShape(sp.acc, nx - 20, y));
    out.push(`<ellipse class="staff-stroke" stroke-width="2.6" cx="${nx}" cy="${y}" rx="7.6" ry="5.2" transform="rotate(-20 ${nx} ${y})"/>`);
  } else if(placeholder){
    out.push(`<text class="staff-q" x="${nx}" y="${yOf(22) + 12}">?</text>`);
  }
  out.push('</svg>');
  return out.join('');
}
function scaleStaffSVG(sc, cur){
  const h = 6, Y0 = 92, yOf = dn => Y0 - (dn - 18) * h, W = 380, H = 142;
  const out = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scale in bass clef with fingerings">`];
  for(let dn = 18; dn <= 26; dn += 2) out.push(`<line class="staff-line" x1="6" x2="${W - 6}" y1="${yOf(dn)}" y2="${yOf(dn)}"/>`);
  const sigEnd = clefAndSig(out, sc, yOf);
  const ps = info(sc).positions, x0 = Math.max(96, sigEnd + 26), dx = ps.length > 1 ? Math.min(40, (W - 20 - x0) / (ps.length - 1)) : 0;
  ps.forEach((p, i) => {
    const sp = spellIn(sc, p.midi), dn = writtenDn(sp), x = x0 + i * dx, y = yOf(dn);
    const on = cur != null && cur === p.midi;
    ledgers(out, x, dn, yOf, 12);
    const inKey = info(sc).notes.some(n => n.pc === sp.pc);
    const acc = !inKey && sp.acc !== 0 ? accShape(sp.acc, x - 15, y, 0.85) : '';
    out.push(`<g class="snote" data-s="${p.s}" data-n="${p.n}"><rect x="${x - Math.max(dx, 24) / 2}" y="0" width="${Math.max(dx, 24)}" height="${H}" fill="transparent"/>${acc}`
      + `<ellipse class="${on ? 'staff-on' : 'staff-stroke'}" stroke-width="2.4" cx="${x}" cy="${y}" rx="7.2" ry="5" transform="rotate(-20 ${x} ${y})"/>`
      + `<text class="staff-fing${on ? ' on' : ''}" x="${x}" y="${H - 8}">${p.f}</text></g>`);
  });
  out.push('</svg>');
  return out.join('');
}

/* ---------- rendering: fingerboard ---------- */
const SX = [76, 134, 192, 250], NUT = 70, TOP = 26;
const boardLen = () => 300 + (displayMax() - 4) * 30;
function yOfN(n){
  if(n === 0) return NUT - 24;
  const m = displayMax() + 0.65, K = boardLen() / (1 - Math.pow(2, -m / 12));
  return NUT + K * (1 - Math.pow(2, -n / 12));
}
function boardDots(){
  const dots = [], mode = settings.mode, fing = fingering(), sc0 = focus();
  const label = p => nameMidi(p.midi);
  const isTonic = p => { const sc = scaleFor(p.midi); return mod12(p.midi) === info(sc).tonicPc; };
  const keyDot = p => dots.push({...p, kind: isTonic(p) ? 'tonic' : 'key', label:label(p), finger:fing[p.s + ':' + p.n]});
  if(mode === 'explore'){
    activePositions().forEach(keyDot);
    if(explore.cur){ const m = STRINGS[explore.cur.s].midi + explore.cur.n; dots.push({...explore.cur, midi:m, kind:'target', ring:true, label:label({midi:m}), finger:fing[explore.cur.s + ':' + explore.cur.n]}); }
    return dots;
  }
  if(q.target != null){
    const hints = settings.hints;
    activePositions().forEach(p => {
      if(q.solved && p.midi === q.target) return;
      if(hints === 'dots') dots.push({...p, kind:'ghost'});
      else if(hints === 'names') keyDot(p);
    });
    q.wrongTaps.forEach(p => dots.push({...p, kind:'wrong', label:nameMidi(p.midi, q.sc)}));
    if(q.solved){
      let ps = activePositions().filter(p => p.midi === q.target);
      if(!ps.length) ps = allPositions(displayMax()).filter(p => p.midi === q.target);
      ps.forEach(p => dots.push({...p, kind:'target', ring:true, label:nameMidi(p.midi, q.sc), finger:fing[p.s + ':' + p.n]}));
    }
  } else if(mode !== 'read'){
    activePositions().forEach(keyDot);
  }
  return dots;
}
function renderBoard(){
  const maxN = displayMax(), H = NUT + boardLen() + 26, W = 320;
  const board = $('#board');
  board.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const o = [];
  o.push(`<defs><clipPath id="fbclip"><path d="M52 ${TOP} L274 ${TOP} L282 ${H} L44 ${H} Z"/></clipPath></defs>`);
  o.push(`<path class="fb-board" d="M52 ${TOP} L274 ${TOP} L282 ${H} Q163 ${H + 6} 44 ${H} Z"/>`);
  o.push(`<rect class="fb-head" x="52" y="${TOP}" width="222" height="${NUT - TOP}"/>`);
  o.push(`<g clip-path="url(#fbclip)">`);
  const bands = [...new Set(activePositions().filter(p => p.n > 0).map(p => p.n))];
  bands.forEach(n => { const y = yOfN(n); o.push(`<line class="fb-tape" x1="40" x2="290" y1="${y}" y2="${y}"/>`); });
  for(let n = 1; n <= maxN; n++){ const y = yOfN(n); o.push(`<line class="fb-pos" x1="40" x2="290" y1="${y}" y2="${y}"/>`); }
  o.push('</g>');
  o.push(`<rect class="fb-nut" x="52" y="${NUT - 3.5}" width="222" height="7" rx="2"/>`);
  const widths = [4.4, 3.6, 2.8, 2.2];
  SX.forEach((x, i) => o.push(`<line class="fb-str" stroke-width="${widths[i]}" x1="${x}" x2="${x}" y1="${TOP}" y2="${H - 2}"/>`));
  STRINGS.forEach((st, i) => o.push(`<text class="fb-strname" x="${SX[i]}" y="17">${st.name}</text>`));
  boardDots().forEach(d => {
    const cx = SX[d.s], cy = yOfN(d.n);
    if(d.kind === 'ghost'){ o.push(`<circle class="dot-ghost" cx="${cx}" cy="${cy}" r="${d.n === 0 ? 6 : 7}"/>`); return; }
    const small = maxN > 7;
    const r = d.kind === 'target' ? (small ? 14 : 17) : (small ? 12.5 : (d.n === 0 ? 14 : 15.5));
    o.push(`<circle class="dot-${d.kind}" cx="${cx}" cy="${cy}" r="${r}"/>`);
    if(d.ring) o.push(`<circle class="ring pulse" cx="${cx}" cy="${cy}" r="${r + 3}"/>`);
    const lab = d.label || '';
    o.push(`<text class="dot-txt${d.kind === 'wrong' ? ' light' : ''}${lab.length > 2 || small ? ' sm' : ''}" x="${cx}" y="${cy + 0.5}">${lab}</text>`);
    if(settings.fingers && d.n > 0 && d.finger) o.push(`<text class="fb-finger" x="${cx + r + 4}" y="${cy}">${d.finger}</text>`);
  });
  if(flash && Date.now() - flash.id < 500) o.push(`<circle class="ring flash" cx="${SX[flash.s]}" cy="${yOfN(flash.n)}" r="18"/>`);
  board.innerHTML = o.join('');
}
function hitTest(x, y){
  let s = -1, bd = 1e9;
  SX.forEach((sx, i) => { const d = Math.abs(x - sx); if(d < bd){ bd = d; s = i; } });
  if(bd > 30) return null;
  if(y < TOP - 4) return null;
  if(y < NUT - 6) return {s, n:0};
  const maxN = displayMax(); let n = 1, nd = 1e9;
  for(let k = 1; k <= maxN; k++){ const d = Math.abs(yOfN(k) - y); if(d < nd){ nd = d; n = k; } }
  if(y > yOfN(maxN) + 40) return null;
  return {s, n};
}

/* ---------- rendering: controls ---------- */
const ICON_PLAY = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5v13l11-6.5z" fill="currentColor"/></svg>';
const ICON_AGAIN = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7h-2.2A4.8 4.8 0 1 1 10 5.2V8l4-3.9L10 0z" fill="currentColor"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="4.5" width="11" height="11" rx="1.5" fill="currentColor"/></svg>';
const ICON_SOUND = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 7a4 4 0 0 1 0 6M15.2 4.8a7 7 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 7.5l5 5M18 7.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const ICON_TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function refLabel(sc){ return settings.prelude === 'arp' ? 'Hear the key chord' : `Hear the key note (${noteName(parse(sc.tonic))})`; }

function renderPrompt(){
  const mode = settings.mode, el = $('#prompt');
  const scoreTxt = score.total ? `${score.right}/${score.total} first try · streak ${score.streak}` : '';
  let head, staff, nameLine = '', where = '', actions = '', wide = false;
  if(mode === 'explore'){
    const f = focus(), cur = explore.cur ? STRINGS[explore.cur.s].midi + explore.cur.n : null;
    head = 'Choose the tempo, press Play and listen.';
    staff = scaleStaffSVG(f, cur); wide = true;
    nameLine = cur != null ? nameMidi(cur) : '';
    where = cur != null ? whereText(explore.cur, fingering()) : '';
    actions = `<div class="tempo">
        <span class="label">Tempo</span>
        <div class="tempo-row"><button class="tbtn" data-act="slower" aria-label="Slower">−</button><output id="bpmOut">${settings.bpm}</output><span class="bpm">BPM</span><button class="tbtn" data-act="faster" aria-label="Faster">+</button></div>
        <input type="range" id="bpm" min="40" max="160" step="2" value="${settings.bpm}" aria-label="Tempo in beats per minute">
      </div>
      <div class="tempo">
        <span class="label">Volume</span>
        <input type="range" id="vol" class="vol" min="0" max="100" step="1" value="${settings.volume}" aria-label="Volume">
      </div>
      <button class="btn toggle" data-act="metro" aria-pressed="${settings.metro}">${settings.metro ? ICON_SOUND : ICON_MUTE} Metronome sound: ${settings.metro ? 'On' : 'Off'}</button>
      <p class="hint">${settings.metro ? '4 clicks count you in, then the metronome keeps the beat under the scale.' : '4 clicks count you in, then you hear only the bass.'}</p>
      <label class="check"><input type="checkbox" id="loop"${settings.loop ? ' checked' : ''}> Repeat</label>
      ${along ? `<button class="btn primary big" data-act="stop">${ICON_STOP} Stop</button>` : `<button class="btn primary big" data-act="along">${ICON_PLAY} Play</button>`}`;
  } else {
    head = ({name:'Hear it, then name it.', find:'Hear it, then find it.', read:'Read it, then find it.'})[mode];
    const reveal = q.solved || (mode === 'read' && q.showName);
    if(q.target == null){
      staff = staffSVG(null, false, focus());
      if(mode !== 'read') actions = `<button class="btn primary big" data-act="start">${ICON_PLAY} Start</button>`;
      where = mode !== 'read' ? 'Silent mode off, volume up.' : '';
    } else {
      const showNote = mode === 'read' || q.solved;
      staff = staffSVG(showNote ? spell(q.target, q.sc) : null, !showNote, q.sc);
      nameLine = reveal ? nameMidi(q.target, q.sc) : '';
      where = q.solved ? whereAll(q.target) : '';
      if(q.solved){
        actions = `<button class="btn primary" data-act="next">Next note →</button>
          <button class="btn" data-act="replay">${ICON_AGAIN} Hear it again</button>`;
      } else if(mode === 'read'){
        actions = `<button class="btn" data-act="showname"${q.showName ? ' disabled' : ''}>Show the name</button>
          <button class="btn" data-act="reveal">Show me where</button>
          <button class="btn small" data-act="skip">Skip</button>`;
      } else {
        actions = `<button class="btn primary" data-act="replay">${ICON_AGAIN} Hear it again</button>
          <button class="btn" data-act="ref">${refLabel(q.sc)}</button>
          <button class="btn small" data-act="reveal">Show me the answer</button>`;
      }
    }
  }
  el.innerHTML = `<div class="prompt-head"><p class="instr">${head}</p><span class="score">${mode === 'explore' ? '' : scoreTxt}</span></div>
    <div class="prompt-body">
      <div class="staff-box${wide ? ' wide' : ''}"${wide ? ' id="exStaff"' : ''}>${staff}<div class="note-name">${nameLine}</div><div class="where">${where}</div></div>
      <div class="actions">${actions}</div>
    </div>
    ${mode === 'explore' ? '' : `<p class="feedback ${q.kind}">${q.msg || ''}</p>`}`;
}
function renderAnswers(){
  const el = $('#answers');
  if(settings.mode !== 'name'){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const f = focus(), pcs = new Set(pool().map(mod12));
  let notes;
  if(f) notes = info(f).notes.filter(n => pcs.has(n.pc));
  else notes = [...pcs].map(pc => { const m = pool().find(x => mod12(x) === pc); return spell(m); }).sort((a, b) => a.l - b.l || a.acc - b.acc);
  el.innerHTML = notes.map(n => {
    let cls = 'nbtn';
    if(f && n.pc === info(f).tonicPc) cls += ' tonic';
    if(q.wrongNames.has(n.pc)) cls += ' wrong';
    if(q.solved && mod12(q.target) === n.pc) cls += ' right';
    const dis = q.target == null || q.solved ? ' disabled' : '';
    return `<button class="${cls}" data-pc="${n.pc}"${dis}>${noteName(n)}</button>`;
  }).join('');
}
function renderTricky(){
  const el = $('#tricky');
  const list = pool().filter(m => (stats.miss[m] || 0) >= 1).sort((a, b) => stats.miss[b] - stats.miss[a]).slice(0, 6);
  el.hidden = !list.length;
  if(!list.length){ el.innerHTML = ''; return; }
  const fing = fingering();
  el.innerHTML = `<p class="label">Practice these</p><div class="tricky-row">${list.map(m => `<button class="tchip" data-midi="${m}"><b>${nameMidi(m)}</b> · ${whereText(posOf(m), fing)}</button>`).join('')}</div>`;
}
function renderChips(){
  const chips = library.map(sc => {
    const lb = scaleLabel(sc), ms = mastery(sc);
    return `<button class="chip" data-sel="${sc.id}" aria-pressed="${focus() === sc}">${ms && ms.learned ? `<span class="tick" title="Learned">${ICON_TICK}</span>` : ''}<span>${lb.name} <small>${lb.sub}</small></span><span class="meter" aria-label="${ms ? ms.pct + '% right' : 'not practised yet'}"><i style="width:${ms ? ms.pct : 0}%"></i></span></button>`;
  });
  $('#scaleChips').innerHTML = chips.join('');
}
const MODES = [
  {id:'name', t:'Name it', s:'Hear a note, pick its name'},
  {id:'find', t:'Find it', s:'Hear a note, tap the spot'},
  {id:'read', t:'Read it', s:'See a note, tap the spot'},
  {id:'explore', t:'Metronome', s:'Hear the scale in tempo'}
];
function renderTabs(){
  const nav = $('#modeTabs');
  nav.innerHTML = MODES.map(m => `<button class="mode" role="tab" data-mode="${m.id}" aria-selected="${settings.mode === m.id}"><b>${m.t}</b><span>${m.s}</span></button>`).join('');
}
function render(){ renderChips(); renderTabs(); renderPrompt(); renderAnswers(); renderBoard(); renderTricky(); }

/* ---------- wiring ---------- */
$('#scaleChips').addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if(!b) return;
  const v = b.dataset.sel;
  settings.sel = v; saveSettings(); lastTarget = null; resetQuestion();
});
$('#modeTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if(!b) return;
  settings.mode = b.dataset.mode; saveSettings(); resetQuestion();
});
$('#prompt').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  ensureAudio();
  const act = b.dataset.act;
  if(act === 'start' || act === 'next' || act === 'skip') newQuestion(true);
  else if(act === 'replay'){ clearTimeout(autoTimer); stopAll(); play(q.target); }
  else if(act === 'ref'){ stopAll(); playRef(q.target, q.sc); }
  else if(act === 'reveal'){ markMiss(); stopAll(); play(q.target); solve(true); }
  else if(act === 'showname'){ q.showName = true; renderPrompt(); }
  else if(act === 'along') startAlong();
  else if(act === 'stop') stopAlong();
  else if(act === 'metro'){ settings.metro = !settings.metro; saveSettings(); renderPrompt(); }
  else if(act === 'slower' || act === 'faster') setBpm(settings.bpm + (act === 'faster' ? 4 : -4));
});
function setBpm(v){
  settings.bpm = Math.max(40, Math.min(160, Math.round(v))); saveSettings();
  const o = $('#bpmOut'), r = $('#bpm'); if(o) o.textContent = settings.bpm; if(r) r.value = settings.bpm;
}
function setVolume(v){
  settings.volume = Math.max(0, Math.min(100, Math.round(v))); saveSettings(); applySound();
  ['#vol', '#setVolume'].forEach(id => { const el = $(id); if(el && Number(el.value) !== settings.volume) el.value = settings.volume; });
}
$('#prompt').addEventListener('input', e => { if(e.target.id === 'bpm') setBpm(Number(e.target.value)); if(e.target.id === 'vol') setVolume(Number(e.target.value)); });
$('#setVolume').value = settings.volume;
$('#setVolume').addEventListener('input', e => setVolume(Number(e.target.value)));
$('#prompt').addEventListener('change', e => {
  if(e.target.id === 'loop'){ settings[e.target.id] = e.target.checked; saveSettings(); }
});
$('#answers').addEventListener('click', e => {
  const b = e.target.closest('[data-pc]'); if(!b || b.disabled) return;
  onName(Number(b.dataset.pc));
});
$('#tricky').addEventListener('click', e => {
  const b = e.target.closest('[data-midi]'); if(!b) return;
  const m = Number(b.dataset.midi), p = posOf(m); play(m, 0, 1, p.s); flash = {s:p.s, n:p.n, id:Date.now()}; renderBoard();
});
$('#board').addEventListener('click', e => {
  const board = $('#board'), ctm = board.getScreenCTM(); if(!ctm) return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
  const hit = hitTest(p.x, p.y); if(hit) onTap(hit);
});
const sBtn = $('#settingsBtn'), panel = $('#settingsPanel');
sBtn.addEventListener('click', () => { panel.hidden = !panel.hidden; sBtn.setAttribute('aria-expanded', String(!panel.hidden)); });
const bindSelect = (id, key, after) => { const el = $(id); el.value = String(settings[key]); el.addEventListener('change', () => { settings[key] = el.value; saveSettings(); after(); }); };
const bindCheck = (id, key, after) => { const el = $(id); el.checked = !!settings[key]; el.addEventListener('change', () => { settings[key] = el.checked; saveSettings(); after(); }); };
bindSelect('#setPrelude', 'prelude', render);
bindSelect('#setNaming', 'naming', render);
bindSelect('#setHints', 'hints', render);
bindCheck('#setFingers', 'fingers', render);
bindCheck('#setAuto', 'auto', () => { if(!settings.auto) clearTimeout(autoTimer); });
bindCheck('#setOctave', 'octave', () => {});

if(!library.some(x => x.id === settings.sel)) settings.sel = library[0].id;
if(settings.mode === 'read') newQuestion(false); else render();
})();
</script>
</body>
</html>
